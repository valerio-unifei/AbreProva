<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 100%; }
        h2 { color: #1c1e21; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #007bff; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        button:disabled { background-color: #ccc; }
        #status { margin-top: 20px; color: #555; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Acesso Aluno</h2>
    <form id="formRedirecionamento">
        <input type="text" id="matricula" placeholder="Digite sua matrícula" required>
        <button type="submit" id="btnAcessar">Acessar Sistema</button>
    </form>
    <p id="status">Processando acesso...</p>
</div>

<script>
    // LISTA DOS DOIS SITES PARA REDIRECIONAMENTO
    const sites = [
        "https://docs.google.com/forms/d/e/1FAIpQLSfr6BRtd3fVMfuS-7VdBRZRJg0PQZUSHtXGPKfSk44qr88Dbw/viewform?usp=header",
        "https://docs.google.com/forms/d/e/1FAIpQLSe_e3zQ1srxPV3RXB16mTriK9WkzMSSISxWJJRoeje3ZQx87A/viewform?usp=header"
    ];

    // COLOQUE AQUI A URL DO SERVIÇO QUE VAI SALVAR OS DADOS (Veja as alternativas abaixo)
    const urlSalvamento = "https://script.google.com/macros/s/AKfycbwlU-NQv9i0-nrxu-GDGe_axKKnH79XUSv6gZ5EEaqZ6jW_4ZocbrR9k6oNcaIa6T6s/exec"; 

    document.getElementById('formRedirecionamento').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const matricula = document.getElementById('matricula').value;
        const btn = document.getElementById('btnAcessar');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        status.style.display = "block";

        // Sorteia o destino primeiro para registrar
        const destinoSorteado = SITES[Math.floor(Math.random() * SITES.length)];

        // Tenta buscar o IP (usando uma API que não bloqueia CORS)
        let ip = "Não capturado";
        try {
            const resIp = await fetch('https://api.ipify.org?format=json');
            const dataIp = await resIp.json();
            ip = dataIp.ip;
        } catch (err) { console.log("Erro IP:", err); }

        // Envia os dados para o Google Sheets
        try {
            // Usamos mode: 'no-cors' para evitar problemas de política de segurança do Google
            // mas isso impede de ler a resposta (o que não importa, pois vamos redirecionar)
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    matricula: matricula,
                    ip: ip,
                    destino: destinoSorteado
                })
            });
        } catch (err) {
            console.log("Erro ao salvar:", err);
        }

        // Pequeno delay para garantir o envio e redireciona
        window.location.href = destinoSorteado;
</script>

</body>
</html>
