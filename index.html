<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso a prova</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        input[type="text"] { width: 90%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #45a049; }
        #mensagem { margin-top: 15px; color: #666; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Acesso do Aluno</h2>
    <p>Digite sua matrícula para continuar:</p>
    <form id="formAcesso">
        <input type="text" id="matricula" placeholder="Ex: 2026012345" required>
        <button type="submit">Acessar</button>
    </form>
    <p id="mensagem">Aguarde, redirecionando...</p>
</div>

<script>
    // LISTA DOS DOIS SITES PARA REDIRECIONAMENTO
    const sites = [
        "https://docs.google.com/forms/d/e/1FAIpQLSfr6BRtd3fVMfuS-7VdBRZRJg0PQZUSHtXGPKfSk44qr88Dbw/viewform?usp=header",
        "https://docs.google.com/forms/d/e/1FAIpQLSe_e3zQ1srxPV3RXB16mTriK9WkzMSSISxWJJRoeje3ZQx87A/viewform?usp=header"
    ];

    // COLOQUE AQUI A URL DO SERVIÇO QUE VAI SALVAR OS DADOS (Veja as alternativas abaixo)
    const urlSalvamento = "https://script.google.com/macros/s/AKfycbwlU-NQv9i0-nrxu-GDGe_axKKnH79XUSv6gZ5EEaqZ6jW_4ZocbrR9k6oNcaIa6T6s/exec"; 

    document.getElementById('formRedirecionamento').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const matricula = document.getElementById('matricula').value;
        const btn = document.getElementById('btnAcessar');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        status.style.display = "block";

        // Sorteia o destino primeiro para registrar
        const destinoSorteado = SITES[Math.floor(Math.random() * SITES.length)];

        // Tenta buscar o IP (usando uma API que não bloqueia CORS)
        let ip = "Não capturado";
        try {
            const resIp = await fetch('https://api.ipify.org?format=json');
            const dataIp = await resIp.json();
            ip = dataIp.ip;
        } catch (err) { console.log("Erro IP:", err); }

        // Envia os dados para o Google Sheets
        try {
            // Usamos mode: 'no-cors' para evitar problemas de política de segurança do Google
            // mas isso impede de ler a resposta (o que não importa, pois vamos redirecionar)
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    matricula: matricula,
                    ip: ip,
                    destino: destinoSorteado
                })
            });
        } catch (err) {
            console.log("Erro ao salvar:", err);
        }

        // Pequeno delay para garantir o envio e redireciona
        setTimeout(() => {
            window.location.href = destinoSorteado;
        }, 500);
    });
</script>

</body>
</html>
